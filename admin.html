<body>
  <header class="site-header">
    <div class="container nav-bar">
      <a href="index.html" class="brand">
        <img src="images/site-logo.jpeg" alt="Brilliant Minds logo" class="site-logo">

  <main class="section">
    <div class="container">
      <section id="adminLoginSection" class="admin-login-box">
        <p class="tag">Admin login</p>
        <h1>Login to view spreadsheet data</h1>
        <form id="adminLoginForm" class="form-card small-form">
          <label>
            Username
            <input type="text" name="username" required>
          </label>
          <label>
            Password
            <input type="password" name="password" required>
          </label>
          <button type="submit" class="button button-primary">Login</button>
          <p id="adminLoginMessage" class="message-text"></p>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
